# kube-prometheus-stack values for EKS
# Handles application-level metrics (requests, latency, errors)
# Node-level metrics handled by CloudWatch Container Insights (via Terraform)

prometheus:
  prometheusSpec:
    retention: 15d
    scrapeInterval: 15s
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb

grafana:
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
  adminPassword: "CHANGE_ME_strong_password"

additionalScrapeConfigs:
  - job_name: flask-app
    static_configs:
      - targets:
          - flask-app-service.default.svc.cluster.local:5000
    metrics_path: /metrics
    scrape_interval: 15s
